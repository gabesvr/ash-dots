; gamemode — ativado automaticamente pela regra da Steam: gamemoderun %command%
; (e pelo Prism Launcher, com "Usar GameMode" ligado)

[general]
; prioridade mais alta para o processo do jogo
renice=10
softrealtime=auto
inhibit_screensaver=1

[custom]
; jogo abriu → modo jogo LEVE: agendador gaming + overclock da GPU (ash-turbo game) e a thread de render
; presa ao melhor núcleo (mc-foco). NÃO liga o turbo (ventoinhas 100%, limites no máximo): isso só pelo
; botão da barra. Se o turbo já estiver ligado, o ash-turbo game não mexe em nada.
start=systemd-run --user --collect --unit=ash-game-on sudo -n /usr/local/bin/ash-turbo game on
start=systemd-run --user --collect --unit=mc-foco /home/gabriel/.local/bin/mc-foco
end=systemd-run --user --collect --unit=ash-game-off sudo -n /usr/local/bin/ash-turbo game off
