; gamemode — ativado automaticamente pela regra da Steam: gamemoderun %command%

[general]
; prioridade mais alta para o processo do jogo
renice=10
softrealtime=auto
inhibit_screensaver=1

[custom]
; jogo abriu → modo TURBO completo (ash-turbo); fechou → volta ao normal
start=/home/gabriel/.local/bin/powerprofile set performance
end=/home/gabriel/.local/bin/powerprofile set balanced
