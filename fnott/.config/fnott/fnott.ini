# fnott — notificações (mesmo estilo do fuzzel: paleta "ash", cantos retos)
# Inicia sozinho via D-Bus na 1ª notificação. SUPER+N fecha todas.

anchor=top-right
stacking-order=top-down
edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=8
min-width=420
max-width=420
max-height=200
icon-theme=Papirus-Ash
max-icon-size=40
selection-helper=fuzzel --dmenu --prompt "󰂚  " --placeholder "Ação…"
dpi-aware=no

background=2a2b31f2
border-color=d6cf8aff
border-size=2
border-radius=0
padding-vertical=14
padding-horizontal=16

title-font=JetBrainsMono Nerd Font:size=9
title-color=7a7d85ff
title-format=%a\n
summary-font=JetBrainsMono Nerd Font:weight=bold:size=11
summary-color=d6cf8aff
summary-format=%s\n
body-font=JetBrainsMono Nerd Font:size=10
body-color=cfd0c8ff
body-format=%b

progress-bar-height=6
progress-color=d6cf8aff

default-timeout=5
max-timeout=10
idle-timeout=0

[low]
border-color=3a3c44ff
summary-color=cfd0c8ff
body-color=7a7d85ff
default-timeout=3

[critical]
border-color=e46b6bff
summary-color=e46b6bff
default-timeout=0
