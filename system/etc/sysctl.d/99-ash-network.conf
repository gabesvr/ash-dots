# Rede: download rápido + latência estável para jogos

# BBR: controle de congestionamento do Google; mantém a velocidade alta
# mesmo com perda de pacotes do Wi-Fi (o cubic derruba a taxa a cada perda)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Buffers maiores para downloads rápidos (até 16 MB por conexão)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 16384

# Conexões que ficam paradas (jogos, Steam) voltam na velocidade cheia
net.ipv4.tcp_slow_start_after_idle = 0
# Descobre o MTU certo sozinho se algum roteador no caminho descarta pacotes grandes
net.ipv4.tcp_mtu_probing = 1
# TCP Fast Open como cliente e servidor
net.ipv4.tcp_fastopen = 3
