# fuzzel — launcher no estilo do Omarchy (SUPER+Space / SUPER+A)
# Cantos retos, borda 2px na cor de destaque, fundo 95%, linha selecionada sutil.

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
prompt=""
placeholder=Buscar…
icons-enabled=yes
icon-theme=Papirus-Ash
terminal=foot -e
layer=overlay
exit-on-keyboard-focus-loss=yes
anchor=center
width=44
lines=8
horizontal-pad=18
vertical-pad=18
inner-pad=10
line-height=28
letter-spacing=0
fields=filename,name,generic,keywords
match-mode=fzf
sort-result=yes
list-executables-in-path=no

[colors]
# paleta "ash"
background=2a2b31f2
text=cfd0c8ff
prompt=d6cf8aff
placeholder=cfd0c894
input=cfd0c8ff
match=d6cf8aff
selection=cfd0c814
selection-text=d6cf8aff
selection-match=d6cf8aff
counter=7a7d85ff
border=d6cf8aff

[border]
width=2
radius=0
